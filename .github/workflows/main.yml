
name: Build & Release

on:
  pull_request:
    branches:
      - main
      - master

  push:
    branches:
      - main
      - master
      - develop

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest

    steps:
      # Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Java
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Install dependencies
      - name: Install dependencies
        run: flutter pub get

      # Build debug APK for pull requests
      - name: Build Debug APK
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      # Configure Android signing
      - name: Configure Android signing
        if: github.event_name == 'push'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python3 - <<'PY'
          import os
          import base64
          from pathlib import Path

          required = [
              "KEYSTORE_BASE64",
              "STORE_PASSWORD",
              "KEY_PASSWORD",
              "KEY_ALIAS"
          ]

          for key in required:
              if not os.environ.get(key):
                  raise SystemExit(f"Missing GitHub Secret: {key}")

          keystore = base64.b64decode(
              os.environ["KEYSTORE_BASE64"],
              validate=True
          )

          if not keystore:
              raise SystemExit("Keystore file is empty")

          app_dir = Path("android/app")
          app_dir.mkdir(parents=True, exist_ok=True)

          (app_dir / "upload-keystore.jks").write_bytes(keystore)

          properties = (
              f"storePassword={os.environ['STORE_PASSWORD']}\n"
              f"keyPassword={os.environ['KEY_PASSWORD']}\n"
              f"keyAlias={os.environ['KEY_ALIAS']}\n"
              "storeFile=upload-keystore.jks\n"
          )

          Path("android/key.properties").write_text(properties)

          print("Android signing configured successfully.")
          PY

      # Verify signing
      - name: Verify Android signing
        if: github.event_name == 'push'
        run: |
          test -s android/key.properties
          test -s android/app/upload-keystore.jks
          echo "Signing files verified."

      # Build signed APK
      - name: Build Android APK
        if: github.event_name == 'push'
        run: |
          flutter build apk --release \
            --split-per-abi \
            --build-number=${{ github.run_number }}

      # Build signed AAB
      - name: Build Android App Bundle
        if: github.event_name == 'push'
        run: |
          flutter build appbundle --release \
            --build-number=${{ github.run_number }}

      # Upload Android artifacts
      - name: Upload Android artifacts
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab

      # Upload to Google Play
      - name: Upload to Google Play
        if: github.event_name == 'push' && github.ref_name == 'develop'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.vrajranitech.solution
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
          releaseName: v1.0.${{ github.run_number }}

      # Build iOS
      - name: Build iOS
        run: flutter build ios --release --no-codesign

      # Package IPA
      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          ln -s ../Runner.app Payload/Runner.app
          zip -r app.ipa Payload

      # Upload iOS artifact
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: build/ios/iphoneos/app.ipa

      # Create GitHub Release
      - name: Push to Releases
        if: github.event_name == 'push'
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/app-release.aab
            build/ios/iphoneos/app.ipa
          tag: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          token: ${{ github.token }}
          commit: ${{ github.sha }}
          allowUpdates: true
          generateReleaseNotes: true
